name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: bun test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run unit tests
        run: bun test ./src

      - name: Build npm bundle (must compile on Node target)
        # Mirrors the build step of scripts/prepublish.sh without the dev-tree sync
        # (the src/ <-> devmap/src/ drift gate is enforced in the dev workspace via
        # scripts/verify-trees.sh before publish). Here we only prove it builds.
        run: bun build --target=node --format=esm src/index.ts --outfile /tmp/devmap-ci-bundle.js

      - name: Smoke-test the built bundle (--version)
        run: node /tmp/devmap-ci-bundle.js --version
